! 阶段 4：frr-router（OpenWrt 25.12，FRR 10.4）
! AS 64500 与 3 台 worker 上的 Calico（AS 64512）建立 eBGP；只收 LB 地址池和 Pod 网段，向集群只宣告云上 VPC 网段（阶段 5）
! 阶段 5：经 WireGuard 隧道与阿里云 ECS（AS 64600，10.255.255.2）建立 eBGP，交换实验网/LB 地址池与 VPC 网段
hostname frr-router
log syslog informational
service integrated-vtysh-config
!
ip prefix-list K8S-LB seq 10 permit 10.200.0.0/24 le 32
ip prefix-list K8S-POD seq 10 permit 10.244.0.0/16 le 32
ip prefix-list CLOUD seq 10 permit 172.16.0.0/12 le 24
ip prefix-list LAB-TO-CLOUD seq 10 permit 10.10.10.0/24
ip prefix-list LAB-TO-CLOUD seq 20 permit 10.200.0.0/24 le 32
!
route-map K8S-IN permit 10
 match ip address prefix-list K8S-LB
exit
route-map K8S-IN permit 20
 match ip address prefix-list K8S-POD
exit
! 向集群只宣告云上网段：节点默认网关是 .2，云主机访问 LB 时，worker 的回程必须经路由器走隧道，否则路径不对称
route-map K8S-OUT permit 10
 match ip address prefix-list CLOUD
exit
!
route-map CLOUD-IN permit 10
 match ip address prefix-list CLOUD
exit
!
route-map CLOUD-OUT permit 10
 match ip address prefix-list LAB-TO-CLOUD
exit
!
router bgp 64500
 bgp router-id 10.10.10.20
 bgp log-neighbor-changes
 neighbor K8S peer-group
 neighbor K8S remote-as 64512
 neighbor K8S description calico-worker
 neighbor K8S timers 3 9
 neighbor K8S timers connect 10
 neighbor 10.10.10.11 peer-group K8S
 neighbor 10.10.10.12 peer-group K8S
 neighbor 10.10.10.13 peer-group K8S
 neighbor 10.255.255.2 remote-as 64600
 neighbor 10.255.255.2 description aliyun-edge
 neighbor 10.255.255.2 timers 10 30
 neighbor 10.255.255.2 timers connect 10
 !
 address-family ipv4 unicast
  ! 实验网网段（直连路由）宣告给云；K8S-OUT 会挡住它，不会发给集群
  network 10.10.10.0/24
  neighbor K8S route-map K8S-IN in
  neighbor K8S route-map K8S-OUT out
  neighbor 10.255.255.2 route-map CLOUD-IN in
  neighbor 10.255.255.2 route-map CLOUD-OUT out
  maximum-paths 8
 exit-address-family
exit
