# 阶段 4.7：在 k8s-master 上管理 frr-router（OpenWrt）配置（root，/root/K8s-VMware/network/ansible）
# 用法：cd network/ansible && ansible-playbook openwrt.yml --check --diff   # 只看差异
#                            ansible-playbook openwrt.yml                    # 应用
[defaults]
inventory = inventory.ini
gathering = explicit
retry_files_enabled = false
