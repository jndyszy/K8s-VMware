# 阶段 5.3：aliyun-edge（阿里云 ECS）侧 WireGuard，对端为本地 frr-router
# 安装位置：/etc/wireguard/wg0.conf（root，600），systemctl enable --now wg-quick@wg0
#
# 本文件不含任何私钥：私钥只存在 ECS 本机的 /etc/wireguard/privatekey，由 PostUp 加载；公钥公开无妨。
# Table = off：wg-quick 默认会按 AllowedIPs 加路由，0.0.0.0/0 会抢走默认路由导致 ECS 失联；
#              隧道里走哪些网段由 BGP（FRR）决定，所以这里不加任何路由。
# 由 frr-router 主动发起并保活（它在 Fusion NAT + 家宽两层 NAT 后），这里只被动监听。
[Interface]
Address = 10.255.255.2/30
ListenPort = 51820
Table = off
PostUp = wg set %i private-key /etc/wireguard/privatekey

[Peer]
# frr-router（OpenWrt，AS 64500）
PublicKey = 224R2o/4b3olT3Yn6MZmbPzlWCt2PtgJHS2bDXzFR3g=
AllowedIPs = 0.0.0.0/0
