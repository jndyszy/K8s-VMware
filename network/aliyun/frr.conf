! 阶段 5.4：aliyun-edge（阿里云 ECS，Ubuntu 26.04，FRR 10.5）
! AS 64600 经 WireGuard 隧道与本地 frr-router（AS 64500，10.255.255.1）建立 eBGP。
! 宣告 VPC 网段 172.16.0.0/12，只接收本地实验网（10.10.10.0/24）与 LoadBalancer 地址池（10.200.0.0/24 及其 /32）。
frr defaults traditional
hostname aliyun-edge
log syslog informational
service integrated-vtysh-config
!
! 让 BGP 能宣告整个 VPC 汇总网段：指向本交换机网关（VPC vRouter），转发行为与默认路由一致
ip route 172.16.0.0/12 172.28.63.253
!
ip prefix-list LAB seq 10 permit 10.10.10.0/24
ip prefix-list LAB seq 20 permit 10.200.0.0/24 le 32
ip prefix-list VPC seq 10 permit 172.16.0.0/12
!
route-map LAB-IN permit 10
 match ip address prefix-list LAB
exit
!
route-map VPC-OUT permit 10
 match ip address prefix-list VPC
exit
!
! 经隧道学到的路由，内核里的源地址设为 ECS 的 VPC 地址。否则 ECS 主动访问实验网时源地址是 wg0 的 10.255.255.2，
! 节点上只有 172.16.0.0/12 的回程路由，回包会被送往默认网关 .2 而丢失（实测：能 ping 通路由器，ping 不通 worker）。
route-map SET-SRC permit 10
 set src 172.28.57.240
exit
ip protocol bgp route-map SET-SRC
!
router bgp 64600
 bgp router-id 10.255.255.2
 bgp log-neighbor-changes
 neighbor 10.255.255.1 remote-as 64500
 neighbor 10.255.255.1 description frr-router
 ! 跨公网的隧道，计时器比实验网内（3 9）宽松，避免公网抖动引起会话震荡
 neighbor 10.255.255.1 timers 10 30
 neighbor 10.255.255.1 timers connect 10
 !
 address-family ipv4 unicast
  network 172.16.0.0/12
  neighbor 10.255.255.1 route-map LAB-IN in
  neighbor 10.255.255.1 route-map VPC-OUT out
 exit-address-family
exit
