# lab-api SLO 仪表盘（阶段 3）：Grafana sidecar 自动加载带 grafana_dashboard 标签的 ConfigMap
# 需要 values.yaml 中 grafana.sidecar.dashboards.searchNamespace: ALL
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-api-slo-dashboard
  labels:
    app: lab-api
    grafana_dashboard: "1"
data:
  lab-api-slo.json: |
    {
      "uid": "lab-api-slo",
      "title": "lab-api / SLO",
      "tags": [
        "lab-api",
        "slo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "数据源",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "SLO 概览（30 天）",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "可用性（30 天）",
          "description": "非 5xx 请求占比。SLO 99.5%，低于目标显示红色。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - lab_api:http_error_ratio:rate30d",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "剩余错误预算：可用性",
          "description": "1 = 一点没用，0 = 刚好用完，负数 = 超支。低于 25% 应暂停高风险发布。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "lab_api:error_budget_remaining:availability_30d",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "延迟达标率（30 天）",
          "description": "250ms 内完成的请求占比。SLO 99%。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - lab_api:http_slow_ratio:rate30d",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "剩余错误预算：延迟",
          "description": "延迟 SLO 的剩余错误预算。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "lab_api:error_budget_remaining:latency_30d",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "row",
          "title": "燃烧率（错误预算消耗速度）",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "可用性燃烧率",
          "description": "燃烧率 = 当前错误率 ÷ 错误预算比例。1 表示按此速度 30 天正好用完预算；14.4 表示 1 小时消耗 2%（紧急告警阈值），6 表示 6 小时消耗 5%。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "lab_api:http_error_ratio:rate5m / (1 - 0.995)",
              "legendFormat": "5m"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "lab_api:http_error_ratio:rate1h / (1 - 0.995)",
              "legendFormat": "1h"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "C",
              "expr": "lab_api:http_error_ratio:rate6h / (1 - 0.995)",
              "legendFormat": "6h"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "延迟燃烧率",
          "description": "慢请求占比 ÷ 1%。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "lab_api:http_slow_ratio:rate5m / (1 - 0.99)",
              "legendFormat": "5m"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "lab_api:http_slow_ratio:rate1h / (1 - 0.99)",
              "legendFormat": "1h"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "C",
              "expr": "lab_api:http_slow_ratio:rate6h / (1 - 0.99)",
              "legendFormat": "6h"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "row",
          "title": "流量与延迟",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "请求速率（按状态码）",
          "description": "每秒请求数，按 HTTP 状态码拆分。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "sum by (code) (rate(http_requests_total{namespace=\"lab\", job=\"lab-api\", path=\"/\"}[1m]))",
              "legendFormat": "{{code}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "错误率",
          "description": "5xx 占比；虚线为 SLO 允许的 0.5%。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "lab_api:http_error_ratio:rate5m",
              "legendFormat": "5m"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "lab_api:http_error_ratio:rate1h",
              "legendFormat": "1h"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.005
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "延迟分位数",
          "description": "由直方图估算的分位数；虚线为 250ms 阈值。分位数是桶内线性插值的估算值，SLO 判定以达标率为准。",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"lab\", job=\"lab-api\", path=\"/\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "B",
              "expr": "histogram_quantile(0.90, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"lab\", job=\"lab-api\", path=\"/\"}[5m])))",
              "legendFormat": "p90"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"lab\", job=\"lab-api\", path=\"/\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.25
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "row",
          "title": "日志（Loki）",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "panels": []
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "每分钟错误日志数",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "从日志统计：level=ERROR 的访问日志条数。和指标里的 5xx 速率应当一致，可互相印证。",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=\"lab\", app=\"lab-api\"} | json | level=\"ERROR\" [1m]))",
              "legendFormat": "errors/min"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 15,
          "type": "logs",
          "title": "5xx 访问日志",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "lab-api 返回 5xx 的请求明细。燃烧率告警触发时先看这里：哪个 Pod、什么时间、耗时多少。",
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 8,
            "y": 25
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"lab\", app=\"lab-api\"} | json | status >= 500"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }
