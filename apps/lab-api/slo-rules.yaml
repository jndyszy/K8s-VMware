# lab-api SLO 记录规则（阶段 3）
#
# SLI（服务质量指标），只统计业务接口 /，不含探针和 /metrics：
#   可用性：返回码不是 5xx 的请求占比
#   延迟：  250ms 内完成的请求占比（250ms 对应直方图的 le="0.25" 桶边界，必须取桶边界才能精确计算）
# SLO（服务质量目标），以 30 天为周期：
#   可用性 99.5%  → 错误预算 0.5%，30 天约 3.6 小时
#   延迟   99%    → 允许 1% 的请求超过 250ms
#
# 记录规则把常用查询预先算好存成新序列，Grafana 和告警直接读结果，查询快且口径统一。
# 命名约定 level:metric:operations，例如 lab_api:http_error_ratio:rate5m
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-api-slo
  labels: { app: lab-api }
spec:
  groups:
    - name: lab-api-slo-target
      rules:
        # SLO 目标值存成常量序列，仪表盘和告警引用同一个值
        - record: lab_api:slo_availability:target
          expr: vector(0.995)
        - record: lab_api:slo_latency:target
          expr: vector(0.99)
    - name: lab-api-sli
      interval: 30s
      rules:
        # ---- 5m 窗口 ----
        - record: lab_api:http_error_ratio:rate5m
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[5m]))
        - record: lab_api:http_slow_ratio:rate5m
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[5m]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[5m]))
            )
        # ---- 30m 窗口 ----
        - record: lab_api:http_error_ratio:rate30m
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[30m]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[30m]))
        - record: lab_api:http_slow_ratio:rate30m
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[30m]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[30m]))
            )
        # ---- 1h 窗口 ----
        - record: lab_api:http_error_ratio:rate1h
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[1h]))
        - record: lab_api:http_slow_ratio:rate1h
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[1h]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[1h]))
            )
        # ---- 2h 窗口 ----
        - record: lab_api:http_error_ratio:rate2h
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[2h]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[2h]))
        - record: lab_api:http_slow_ratio:rate2h
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[2h]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[2h]))
            )
        # ---- 6h 窗口 ----
        - record: lab_api:http_error_ratio:rate6h
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[6h]))
        - record: lab_api:http_slow_ratio:rate6h
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[6h]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[6h]))
            )
        # ---- 1d 窗口 ----
        - record: lab_api:http_error_ratio:rate1d
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[1d]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[1d]))
        - record: lab_api:http_slow_ratio:rate1d
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[1d]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[1d]))
            )
        # ---- 3d 窗口 ----
        - record: lab_api:http_error_ratio:rate3d
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[3d]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[3d]))
        - record: lab_api:http_slow_ratio:rate3d
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[3d]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[3d]))
            )
        # ---- 30d 窗口 ----
        - record: lab_api:http_error_ratio:rate30d
          expr: |
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/", code=~"5.."}[30d]))
            /
            sum(rate(http_requests_total{namespace="lab", job="lab-api", path="/"}[30d]))
        - record: lab_api:http_slow_ratio:rate30d
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", le="0.25"}[30d]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/"}[30d]))
            )
    - name: lab-api-error-budget
      interval: 1m
      rules:
        # 剩余错误预算：1 表示一点没用，0 表示刚好用完，负数表示超支
        - record: lab_api:error_budget_remaining:availability_30d
          expr: 1 - lab_api:http_error_ratio:rate30d / (1 - 0.995)
        - record: lab_api:error_budget_remaining:latency_30d
          expr: 1 - lab_api:http_slow_ratio:rate30d / (1 - 0.99)
    # ---- 告警：多窗口、多燃烧率（Google SRE Workbook 第 5 章）----
    # 长窗口和短窗口同时超标才告警：长窗口过滤偶发抖动，短窗口保证问题还在持续；
    # 故障修复后短窗口很快回落，告警随之解除，不会在故障结束后还持续一个小时。
    # 阈值 = 燃烧率 × (1 - SLO)，燃烧率 1 表示 30 天正好用完预算。
    - name: lab-api-slo-alerts
      rules:
        - alert: LabApiAvailabilityBudgetBurnFast
          expr: |
            lab_api:http_error_ratio:rate1h > (14.4 * 0.005)
            and
            lab_api:http_error_ratio:rate5m > (14.4 * 0.005)
          for: 2m
          labels:
            severity: critical
            slo: availability
            service: lab-api
          annotations:
            summary: "lab-api availability 错误预算燃烧过快（1h/5m 燃烧率 > 14.4）"
            description: "错误率在 1h 窗口为 {{ $value | humanizePercentage }}，SLO 允许 0.5%。1 小时消耗约 2% 的 30 天错误预算，约 2 天会全部用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
        - alert: LabApiAvailabilityBudgetBurnMedium
          expr: |
            lab_api:http_error_ratio:rate6h > (6 * 0.005)
            and
            lab_api:http_error_ratio:rate30m > (6 * 0.005)
          for: 15m
          labels:
            severity: critical
            slo: availability
            service: lab-api
          annotations:
            summary: "lab-api availability 错误预算燃烧过快（6h/30m 燃烧率 > 6）"
            description: "错误率在 6h 窗口为 {{ $value | humanizePercentage }}，SLO 允许 0.5%。6 小时消耗约 5% 的 30 天错误预算，约 5 天会全部用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
        - alert: LabApiAvailabilityBudgetBurnSlow
          expr: |
            lab_api:http_error_ratio:rate1d > (3 * 0.005)
            and
            lab_api:http_error_ratio:rate2h > (3 * 0.005)
          for: 1h
          labels:
            severity: warning
            slo: availability
            service: lab-api
          annotations:
            summary: "lab-api availability 错误预算燃烧过快（1d/2h 燃烧率 > 3）"
            description: "错误率在 1d 窗口为 {{ $value | humanizePercentage }}，SLO 允许 0.5%。1 天消耗约 10% 的 30 天错误预算，约 10 天会全部用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
        - alert: LabApiAvailabilityBudgetBurnTrend
          expr: |
            lab_api:http_error_ratio:rate3d > (1 * 0.005)
            and
            lab_api:http_error_ratio:rate6h > (1 * 0.005)
          for: 3h
          labels:
            severity: warning
            slo: availability
            service: lab-api
          annotations:
            summary: "lab-api availability 错误预算燃烧过快（3d/6h 燃烧率 > 1）"
            description: "错误率在 3d 窗口为 {{ $value | humanizePercentage }}，SLO 允许 0.5%。按当前速度，30 天周期结束时预算正好用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
        - alert: LabApiLatencyBudgetBurnFast
          expr: |
            lab_api:http_slow_ratio:rate1h > (14.4 * 0.01)
            and
            lab_api:http_slow_ratio:rate5m > (14.4 * 0.01)
          for: 2m
          labels:
            severity: critical
            slo: latency
            service: lab-api
          annotations:
            summary: "lab-api latency 错误预算燃烧过快（1h/5m 燃烧率 > 14.4）"
            description: "慢请求（>250ms）占比在 1h 窗口为 {{ $value | humanizePercentage }}，SLO 允许 1%。1 小时消耗约 2% 的 30 天错误预算，约 2 天会全部用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
        - alert: LabApiLatencyBudgetBurnMedium
          expr: |
            lab_api:http_slow_ratio:rate6h > (6 * 0.01)
            and
            lab_api:http_slow_ratio:rate30m > (6 * 0.01)
          for: 15m
          labels:
            severity: critical
            slo: latency
            service: lab-api
          annotations:
            summary: "lab-api latency 错误预算燃烧过快（6h/30m 燃烧率 > 6）"
            description: "慢请求（>250ms）占比在 6h 窗口为 {{ $value | humanizePercentage }}，SLO 允许 1%。6 小时消耗约 5% 的 30 天错误预算，约 5 天会全部用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
        - alert: LabApiLatencyBudgetBurnSlow
          expr: |
            lab_api:http_slow_ratio:rate1d > (3 * 0.01)
            and
            lab_api:http_slow_ratio:rate2h > (3 * 0.01)
          for: 1h
          labels:
            severity: warning
            slo: latency
            service: lab-api
          annotations:
            summary: "lab-api latency 错误预算燃烧过快（1d/2h 燃烧率 > 3）"
            description: "慢请求（>250ms）占比在 1d 窗口为 {{ $value | humanizePercentage }}，SLO 允许 1%。1 天消耗约 10% 的 30 天错误预算，约 10 天会全部用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
        - alert: LabApiLatencyBudgetBurnTrend
          expr: |
            lab_api:http_slow_ratio:rate3d > (1 * 0.01)
            and
            lab_api:http_slow_ratio:rate6h > (1 * 0.01)
          for: 3h
          labels:
            severity: warning
            slo: latency
            service: lab-api
          annotations:
            summary: "lab-api latency 错误预算燃烧过快（3d/6h 燃烧率 > 1）"
            description: "慢请求（>250ms）占比在 3d 窗口为 {{ $value | humanizePercentage }}，SLO 允许 1%。按当前速度，30 天周期结束时预算正好用完。"
            runbook_url: https://github.com/jndyszy/K8s-VMware/blob/main/docs/stage3-observability.md#错误预算燃烧告警
