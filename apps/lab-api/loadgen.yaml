# lab-api 流量生成器（阶段 3）：集群内持续访问 lab-api，约每秒 4~5 个请求
# 作用：模拟真实用户流量，让 SLI 一直有数据可算（没有流量时错误率是 0/0 = NaN）
# 标签用 app: lab-api-loadgen，不能和 lab-api Service 的选择器（app: lab-api）重叠
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api-loadgen
  labels: { app: lab-api-loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: lab-api-loadgen }
  template:
    metadata:
      labels: { app: lab-api-loadgen }
    spec:
      # busybox 的 sleep 不处理 SIGTERM，不需要优雅退出，缩短等待
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534        # nobody
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["sh", "-c"]
          # 失败（5xx、超时）也继续发，失败本身就是要被 SLI 统计的
          args:
            - |
              while true; do
                wget -q -O /dev/null -T 2 http://lab-api/ || true
                sleep 0.2
              done
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
