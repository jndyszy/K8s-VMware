# SLO 记录规则单元测试（阶段 3）：promtool test rules tests/stage3/slo-rules.test.yaml
# 规则文件由 PrometheusRule 的 spec 提取而来（见 docs/stage3-observability.md）
rule_files:
  - slo-rules.prom.yaml
evaluation_interval: 30s
tests:
  # 两个副本，每分钟各 100 个请求，其中 pod-a 每分钟 2 个 500 → 错误率 2/200 = 1%
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="a", code="200"}'
        values: '0+98x60'
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="a", code="500"}'
        values: '0+2x60'
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="b", code="200"}'
        values: '0+100x60'
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="b", code="500"}'
        values: '0+0x60'
      # 探针和 /metrics 的请求不计入 SLI
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/healthz", pod="a", code="500"}'
        values: '0+1000x60'
      # 延迟：每分钟 200 个请求，其中 196 个在 250ms 内 → 慢请求占比 2%
      - series: 'http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", pod="a", le="0.25"}'
        values: '0+196x60'
      - series: 'http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/", pod="a"}'
        values: '0+200x60'
    promql_expr_test:
      - expr: lab_api:http_error_ratio:rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'lab_api:http_error_ratio:rate5m'
            value: 0.01
      # 1 - 0.98 在二进制浮点下是 0.020000000000000018，先 round 到 0.001 再比较；
      # round() 会去掉指标名，所以期望的标签是空集合 {}
      - expr: round(lab_api:http_slow_ratio:rate5m, 0.001)
        eval_time: 30m
        exp_samples:
          - labels: '{}'
            value: 0.02
      # 错误率 1%，预算 0.5% → 剩余 1 - 0.01/0.005 = -1（超支一倍）
      - expr: round(lab_api:error_budget_remaining:availability_30d, 0.001)
        eval_time: 60m
        exp_samples:
          - labels: '{}'
            value: -1
      - expr: lab_api:slo_availability:target
        eval_time: 1m
        exp_samples:
          - labels: 'lab_api:slo_availability:target'
            value: 0.995

  # ---- 告警测试 ----
  # 30 分钟正常，然后错误率 50%（燃烧率 100）持续 30 分钟。
  # 断言 Prometheus 自动生成的 ALERTS 序列（只含告警名、状态和标签），
  # 而不是 alert_rule_test：后者会连注解一起比较，注解里的百分比是运行时算出的，没法写死。
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="a", code="200"}'
        values: '0+100x30 3000+50x30'
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="a", code="500"}'
        values: '0+0x30 0+50x30'
    promql_expr_test:
      # 正常阶段不告警
      - expr: ALERTS{alertname="LabApiAvailabilityBudgetBurnFast"}
        eval_time: 29m
        exp_samples: []
      # 故障约 20 分钟后：1h 错误率约 0.19、5m 错误率 0.5，都超过 14.4 × 0.5% = 7.2%，且已持续超过 for: 2m
      - expr: ALERTS{alertname="LabApiAvailabilityBudgetBurnFast", alertstate="firing"}
        eval_time: 50m
        exp_samples:
          - labels: 'ALERTS{alertname="LabApiAvailabilityBudgetBurnFast", alertstate="firing", severity="critical", slo="availability", service="lab-api"}'
            value: 1
      # 6h 窗口还没超过 6 × 0.5% = 3% 太久，加上 for: 15m，此时不应触发
      - expr: ALERTS{alertname="LabApiAvailabilityBudgetBurnMedium", alertstate="firing"}
        eval_time: 35m
        exp_samples: []
      # 延迟没有问题，延迟告警不应触发
      - expr: ALERTS{slo="latency"}
        eval_time: 50m
        exp_samples: []
