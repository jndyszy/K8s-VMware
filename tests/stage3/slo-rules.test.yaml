# SLO 记录规则单元测试（阶段 3）：promtool test rules tests/stage3/slo-rules.test.yaml
# 规则文件由 PrometheusRule 的 spec 提取而来（见 docs/stage3-observability.md）
rule_files:
  - slo-rules.prom.yaml
evaluation_interval: 30s
tests:
  # 两个副本，每分钟各 100 个请求，其中 pod-a 每分钟 2 个 500 → 错误率 2/200 = 1%
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="a", code="200"}'
        values: '0+98x60'
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="a", code="500"}'
        values: '0+2x60'
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="b", code="200"}'
        values: '0+100x60'
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/", pod="b", code="500"}'
        values: '0+0x60'
      # 探针和 /metrics 的请求不计入 SLI
      - series: 'http_requests_total{namespace="lab", job="lab-api", path="/healthz", pod="a", code="500"}'
        values: '0+1000x60'
      # 延迟：每分钟 200 个请求，其中 196 个在 250ms 内 → 慢请求占比 2%
      - series: 'http_request_duration_seconds_bucket{namespace="lab", job="lab-api", path="/", pod="a", le="0.25"}'
        values: '0+196x60'
      - series: 'http_request_duration_seconds_count{namespace="lab", job="lab-api", path="/", pod="a"}'
        values: '0+200x60'
    promql_expr_test:
      - expr: lab_api:http_error_ratio:rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'lab_api:http_error_ratio:rate5m'
            value: 0.01
      - expr: lab_api:http_slow_ratio:rate5m
        eval_time: 30m
        exp_samples:
          - labels: 'lab_api:http_slow_ratio:rate5m'
            value: 0.02
      # 错误率 1%，预算 0.5% → 剩余 1 - 0.01/0.005 = -1（超支一倍）
      - expr: lab_api:error_budget_remaining:availability_30d
        eval_time: 60m
        exp_samples:
          - labels: 'lab_api:error_budget_remaining:availability_30d'
            value: -1
      - expr: lab_api:slo_availability:target
        eval_time: 1m
        exp_samples:
          - labels: 'lab_api:slo_availability:target'
            value: 0.995
