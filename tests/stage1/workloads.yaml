# 阶段 1 验收用的测试负载：kubectl apply -f tests/stage1/workloads.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: stage1-test
---
# 两个 Pod 固定到不同 Worker，用于验证跨节点通信
apiVersion: v1
kind: Pod
metadata:
  name: pod-a
  namespace: stage1-test
  labels: { role: client }          # 在 NetworkPolicy 中被放行
spec:
  nodeName: k8s-worker-1
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-b
  namespace: stage1-test
  labels: { role: other }           # 不在放行名单里
spec:
  nodeName: k8s-worker-2
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "86400"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: stage1-test
spec:
  replicas: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: web }
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: stage1-test
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
